<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secupyme — Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <div class="page-header">
        <h2>PANEL DE CONTROL</h2>
        <p>Resumen de seguridad</p>


      <div id="skeleton-stats" class="stats-grid">
        <div class="skeleton-card skeleton-stat skeleton"></div>
        <div class="skeleton-card skeleton-stat skeleton"></div>
        <div class="skeleton-card skeleton-stat skeleton"></div>
        <div class="skeleton-card skeleton-stat skeleton"></div>
        <div class="skeleton-card skeleton-stat skeleton"></div>
      </div>

      <div id="contenido-stats" style="display:none;">
      <div class="stats-grid">
        <div class="stat-card" style="cursor:pointer;" onclick="window.location.href='/reportes.html'">
          <div class="stat-icon">⚠</div>
          <div class="stat-info">
            <h3 id="totalReportes">0</h3>
            <p>REPORTES TOTALES</p>
          </div>
        </div>
        <div class="stat-card" style="cursor:pointer;" onclick="window.location.href='/reportes.html?estado=abierto'">
          <div class="stat-icon">🔴</div>
          <div class="stat-info">
            <h3 id="reportesAbiertos">0</h3>
            <p>ABIERTOS</p>
          </div>
        </div>
        <div class="stat-card" style="cursor:pointer;" onclick="window.location.href='/reportes.html?estado=en+proceso'">
          <div class="stat-icon">🟡</div>
          <div class="stat-info">
            <h3 id="reportesEnProceso">0</h3>
            <p>EN PROCESO</p>
          </div>
        </div>
        <div class="stat-card" style="cursor:pointer;" onclick="window.location.href='/reportes.html?estado=resuelto'">
          <div class="stat-icon">🟢</div>
          <div class="stat-info">
            <h3 id="reportesResueltos">0</h3>
            <p>RESUELTOS</p>
          </div>
        </div>
        <div class="stat-card" id="riskScoreCard" style="cursor:default;">
          <div class="stat-icon" id="riskIcono">🛡</div>
          <div class="stat-info">
            <h3 id="riskScoreValor">--</h3>
            <p id="riskScoreNivel">RISK SCORE</p>
          </div>
        </div>
      </div>

      </div><!-- /contenido-stats -->

      <div class="form-card" style="margin-top: 24px;">
        <h3>REPORTES ÚLTIMAS 72 HORAS</h3>
        <table class="tabla-reportes">
          <thead>
            <tr>
              <th>EMPRESA</th>
              <th>TIPO</th>
              <th>ESTADO</th>
              <th>FECHA</th>
            </tr>
          </thead>
          <tbody id="tablaBody">
          <tr class="skeleton-tabla"><td colspan="4"><div class="skeleton skeleton-row"></div></td></tr>
          <tr class="skeleton-tabla"><td colspan="4"><div class="skeleton skeleton-row"></div></td></tr>
          <tr class="skeleton-tabla"><td colspan="4"><div class="skeleton skeleton-row"></div></td></tr>
        </tbody>
        </table>


        <div class="stat-card" id="riskScoreCard" style="cursor:default;">
          <div class="stat-icon" id="riskIcono">🛡</div>
          <div class="stat-info">
            <h3 id="riskScoreValor">--</h3>
            <p id="riskScoreNivel">RISK SCORE</p>
          </div>
        </div>
      </div>

      <div class="form-card ocultar-movil" style="margin-top: 24px;">
        <h3>REPORTES POR TIPO DE VULNERABILIDAD</h3>
        <canvas id="graficaReportes" style="max-height: 300px;"></canvas>

    </main>
  </div>

  <script src="/toast.js"></script>
  <script src="/chat.js"></script>
  <script src="/notifications.js"></script>
  <script src="sidebar.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/';
    cargarSidebar('dashboard');
    if (!sessionStorage.getItem('notif_login_done')) {
      const nombre = localStorage.getItem('nombre') || 'Usuario';
      Notificaciones.agregar('sistema', 'Sesión iniciada', 'Bienvenido, ' + nombre);
      sessionStorage.setItem('notif_login_done', '1');
    }

    async function cargarRiskScore() {
      try {
        const res = await fetch('/api/risk/mi-score', { headers: { 'authorization': token } });
        if (!res.ok) return;
        const data = await res.json();
        const score = data.score ?? 0;
        const nivel = data.nivel ?? 'normal';
        document.getElementById('riskScoreValor').textContent = score + '/100';
        document.getElementById('riskScoreNivel').textContent = 'RISK SCORE · ' + nivel.toUpperCase();
        const iconos = { normal: '🟢', monitoreo: '🟡', alerta: '🟠', critico: '🔴' };
        document.getElementById('riskIcono').textContent = iconos[nivel] || '🛡';
        const colores = { normal: '#22c55e', monitoreo: '#eab308', alerta: '#f97316', critico: '#ef4444' };
        document.getElementById('riskScoreCard').style.borderColor = colores[nivel] || '#7c3aed';
        const nivelPrevio = localStorage.getItem('secupyme_risk_nivel');
        if (nivelPrevio !== nivel && (nivel === 'alerta' || nivel === 'critico')) {
          Notificaciones.agregar('riesgo', 'Risk Score: ' + nivel.toUpperCase(), 'Tu puntuación es ' + score + '/100');
        }
        localStorage.setItem('secupyme_risk_nivel', nivel);
      } catch(e) { console.error('Risk score:', e); }
    }
    cargarRiskScore();

    async function cargarTodo() {
      try {
        const response = await fetch('/api/reportes', { headers: { 'authorization': token } });
        if (!response.ok) throw new Error('Error');
        const reportes = await response.json();

        document.getElementById('skeleton-stats').style.display = 'none';
        document.getElementById('contenido-stats').style.display = 'block';
        document.getElementById('totalReportes').textContent = reportes.length;
        document.getElementById('reportesAbiertos').textContent = reportes.filter(r => r.estado === 'abierto').length;
        document.getElementById('reportesEnProceso').textContent = reportes.filter(r => r.estado === 'en proceso').length;
        document.getElementById('reportesResueltos').textContent = reportes.filter(r => r.estado === 'resuelto').length;

        const hace72h = new Date(Date.now() - 72 * 60 * 60 * 1000);
        const recientes = reportes.filter(r => new Date(r.fecha) > hace72h);
        const tbody = document.getElementById('tablaBody');
        tbody.innerHTML = '';
        document.querySelectorAll('.skeleton-tabla').forEach(r => r.remove());

        if (recientes.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--texto-suave); font-size: 12px; padding: 24px;">Sin reportes en las últimas 72 horas</td></tr>`;
        } else {
          recientes.forEach(r => {
            const fecha = new Date(r.fecha).toLocaleString('es-CO');
            const badgeClass = r.estado === 'abierto' ? 'badge-abierto' : r.estado === 'en proceso' ? 'badge-proceso' : 'badge-resuelto';
            tbody.innerHTML += `
              <tr style="cursor:pointer;" onclick="window.location.href='/reporte-detalle.html?id=${r._id}'">
                <td data-label="EMPRESA">${r.empresa || '—'}</td>
                <td data-label="TIPO">${r.tipoVulnerabilidad || '—'}</td>
                <td data-label="ESTADO"><span class="badge ${badgeClass}">${r.estado.toUpperCase()}</span></td>
                <td data-label="FECHA" style="font-size: 11px; color: var(--texto-suave);">${fecha}</td>
              </tr>
            `;
          });
        }

        const tipos = ['phishing', 'malware', 'acceso no autorizado', 'fuga de datos', 'otro'];
        const conteos = tipos.map(t => reportes.filter(r => r.tipoVulnerabilidad === t).length);

        new Chart(document.getElementById('graficaReportes'), {
          type: 'bar',
          data: {
            labels: ['Phishing', 'Malware', 'Acceso no autorizado', 'Fuga de datos', 'Otro'],
            datasets: [{
              label: 'Reportes',
              data: conteos,
              backgroundColor: 'rgba(168, 85, 247, 0.3)',
              borderColor: 'rgba(168, 85, 247, 1)',
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { labels: { color: '#e2d9f3', font: { family: 'Share Tech Mono' } } }
            },
            scales: {
              x: { ticks: { color: '#9d86c8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
              y: { ticks: { color: '#9d86c8', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } }
            }
          }
        });

      } catch (error) {
        console.error('Error en dashboard:', error);
      }
    }

    function mostrarOnboarding() {
      if (localStorage.getItem("onboardingVisto")) return;
      if (document.getElementById('onboardingModal')) return;
      const m = document.createElement("div");
      m.id = "onboardingModal";
      m.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:99999;display:flex;align-items:center;justify-content:center;padding:32px;";
      m.innerHTML = `
        <div style="background:#0d0618;border:1px solid #7c3aed;border-radius:8px;padding:56px 48px;max-width:640px;width:100%;box-shadow:0 0 60px rgba(124,58,237,0.2);">
          <p style="font-family:Share Tech Mono,monospace;font-size:10px;color:#a855f7;letter-spacing:4px;margin-bottom:24px;">BIENVENIDO A SECUPYME</p>
          <h2 style="font-size:32px;font-weight:800;margin-bottom:12px;color:#e2d9f3;line-height:1.2;">Tu seguridad<br>empieza aqui.</h2>
          <p style="font-size:14px;color:#6b5a8a;line-height:1.8;margin-bottom:40px;max-width:480px;">Sigue estos tres pasos para proteger tu empresa desde el primer dia.</p>
          <div style="display:flex;flex-direction:column;gap:20px;margin-bottom:40px;">
            <div style="display:flex;gap:20px;align-items:flex-start;padding:20px;border:1px solid rgba(124,58,237,0.2);border-radius:4px;">
              <span style="font-family:Share Tech Mono,monospace;font-size:20px;color:#7c3aed;font-weight:800;flex-shrink:0;">01</span>
              <div><p style="font-size:14px;font-weight:700;color:#e2d9f3;margin-bottom:4px;">Crea tu primer reporte</p><p style="font-size:12px;color:#6b5a8a;">¿Algo sospechoso ocurrio? Reportalo en la seccion Reportes.</p></div>
            </div>
            <div style="display:flex;gap:20px;align-items:flex-start;padding:20px;border:1px solid rgba(124,58,237,0.2);border-radius:4px;">
              <span style="font-family:Share Tech Mono,monospace;font-size:20px;color:#7c3aed;font-weight:800;flex-shrink:0;">02</span>
              <div><p style="font-size:14px;font-weight:700;color:#e2d9f3;margin-bottom:4px;">Haz tu autoevaluacion</p><p style="font-size:12px;color:#6b5a8a;">Descubre tu nivel de riesgo real en menos de 5 minutos.</p></div>
            </div>
            <div style="display:flex;gap:20px;align-items:flex-start;padding:20px;border:1px solid rgba(124,58,237,0.2);border-radius:4px;">
              <span style="font-family:Share Tech Mono,monospace;font-size:20px;color:#7c3aed;font-weight:800;flex-shrink:0;">03</span>
              <div><p style="font-size:14px;font-weight:700;color:#e2d9f3;margin-bottom:4px;">Activa el 2FA</p><p style="font-size:12px;color:#6b5a8a;">Protege tu cuenta con autenticacion de dos factores.</p></div>
            </div>
          </div>
          <button onclick="localStorage.setItem('onboardingVisto','1');document.getElementById('onboardingModal').remove()" style="width:100%;padding:16px;background:#7c3aed;border:none;color:white;font-family:Share Tech Mono,monospace;font-size:12px;letter-spacing:3px;cursor:pointer;border-radius:2px;">EMPEZAR →</button>
        </div>
      `;
      document.body.appendChild(m);
    }
    mostrarOnboarding();
    cargarTodo();
  </script>
  <script src="/inactividad.js"></script>
</body>
</html>
