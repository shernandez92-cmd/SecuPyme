<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secupyme — Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <div class="page-header">
        <h2>PANEL DE CONTROL</h2>
        <p>Resumen de seguridad</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card" style="cursor:pointer;" onclick="window.location.href='/reportes.html'">
          <div class="stat-icon">⚠</div>
          <div class="stat-info">
            <h3 id="totalReportes">0</h3>
            <p>REPORTES TOTALES</p>
          </div>
        </div>
        <div class="stat-card" style="cursor:pointer;" onclick="window.location.href='/reportes.html?estado=abierto'">
          <div class="stat-icon">🔴</div>
          <div class="stat-info">
            <h3 id="reportesAbiertos">0</h3>
            <p>ABIERTOS</p>
          </div>
        </div>
        <div class="stat-card" style="cursor:pointer;" onclick="window.location.href='/reportes.html?estado=en+proceso'">
          <div class="stat-icon">🟡</div>
          <div class="stat-info">
            <h3 id="reportesEnProceso">0</h3>
            <p>EN PROCESO</p>
          </div>
        </div>
        <div class="stat-card" style="cursor:pointer;" onclick="window.location.href='/reportes.html?estado=resuelto'">
          <div class="stat-icon">🟢</div>
          <div class="stat-info">
            <h3 id="reportesResueltos">0</h3>
            <p>RESUELTOS</p>
          </div>
        </div>
      </div>

      <div class="form-card" style="margin-top: 24px;">
        <h3>REPORTES ÚLTIMAS 72 HORAS</h3>
        <table class="tabla-reportes">
          <thead>
            <tr>
              <th>EMPRESA</th>
              <th>TIPO</th>
              <th>ESTADO</th>
              <th>FECHA</th>
            </tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
      </div>

      <div class="form-card" style="margin-top: 24px;">
        <h3>REPORTES POR TIPO DE VULNERABILIDAD</h3>
        <canvas id="graficaReportes" style="max-height: 300px;"></canvas>
      </div>
    </main>
  </div>

  <script src="/toast.js"></script>
  <script src="/chat.js"></script>
  <script src="sidebar.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/';
    cargarSidebar('dashboard');

    async function cargarTodo() {
      try {
        const response = await fetch('/api/reportes', { headers: { 'authorization': token } });
        if (!response.ok) throw new Error('Error');
        const reportes = await response.json();

        document.getElementById('totalReportes').textContent = reportes.length;
        document.getElementById('reportesAbiertos').textContent = reportes.filter(r => r.estado === 'abierto').length;
        document.getElementById('reportesEnProceso').textContent = reportes.filter(r => r.estado === 'en proceso').length;
        document.getElementById('reportesResueltos').textContent = reportes.filter(r => r.estado === 'resuelto').length;

        const hace72h = new Date(Date.now() - 72 * 60 * 60 * 1000);
        const recientes = reportes.filter(r => new Date(r.fecha) > hace72h);
        const tbody = document.getElementById('tablaBody');
        tbody.innerHTML = '';

        if (recientes.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--texto-suave); font-size: 12px; padding: 24px;">Sin reportes en las últimas 72 horas</td></tr>`;
        } else {
          recientes.forEach(r => {
            const fecha = new Date(r.fecha).toLocaleString('es-CO');
            const badgeClass = r.estado === 'abierto' ? 'badge-abierto' : r.estado === 'en proceso' ? 'badge-proceso' : 'badge-resuelto';
            tbody.innerHTML += `
              <tr style="cursor:pointer;" onclick="window.location.href='/reporte-detalle.html?id=${r._id}'">
                <td>${r.empresa || '—'}</td>
                <td>${r.tipoVulnerabilidad || '—'}</td>
                <td><span class="badge ${badgeClass}">${r.estado.toUpperCase()}</span></td>
                <td style="font-size: 11px; color: var(--texto-suave);">${fecha}</td>
              </tr>
            `;
          });
        }

        const tipos = ['phishing', 'malware', 'acceso no autorizado', 'fuga de datos', 'otro'];
        const conteos = tipos.map(t => reportes.filter(r => r.tipoVulnerabilidad === t).length);

        new Chart(document.getElementById('graficaReportes'), {
          type: 'bar',
          data: {
            labels: ['Phishing', 'Malware', 'Acceso no autorizado', 'Fuga de datos', 'Otro'],
            datasets: [{
              label: 'Reportes',
              data: conteos,
              backgroundColor: 'rgba(168, 85, 247, 0.3)',
              borderColor: 'rgba(168, 85, 247, 1)',
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { labels: { color: '#e2d9f3', font: { family: 'Share Tech Mono' } } }
            },
            scales: {
              x: { ticks: { color: '#9d86c8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
              y: { ticks: { color: '#9d86c8', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } }
            }
          }
        });

      } catch (error) {
        console.error('Error en dashboard:', error);
      }
    }

    function mostrarOnboarding() {
      if (localStorage.getItem("onboardingVisto")) return;
      const m = document.createElement("div");
      m.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;";
      m.innerHTML = "<div style=background:#1a0a2e;border:1px solid #7c3aed;border-radius:4px;padding:40px;max-width:520px;width:100%;><p style=font-family:Share-Tech-Mono,monospace;font-size:11px;color:#a855f7;letter-spacing:3px;margin-bottom:20px;>BIENVENIDO A SECUPYME</p><h2 style=font-size:22px;font-weight:800;margin-bottom:16px;>Tu seguridad empieza aqui</h2><p style=font-size:13px;color:#6b5a8a;line-height:1.8;margin-bottom:28px;>Sigue estos pasos para proteger tu empresa:</p><p style=font-size:13px;color:#e2d9f3;margin-bottom:8px;>01 — Crea tu primer reporte de incidente</p><p style=font-size:13px;color:#e2d9f3;margin-bottom:8px;>02 — Haz la autoevaluacion de seguridad</p><p style=font-size:13px;color:#e2d9f3;margin-bottom:28px;>03 — Activa el 2FA en tu cuenta</p><button onclick=localStorage.setItem(String.fromCharCode(111,110,98,111,97,114,100,105,110,103,86,105,115,116,111),String.fromCharCode(49));this.closest(String.fromCharCode(100,105,118)).parentElement.remove() style=width:100%;padding:14px;background:#7c3aed;border:none;color:white;font-family:monospace;font-size:12px;cursor:pointer;>EMPEZAR</button></div>";
      document.body.appendChild(m);
    }
    mostrarOnboarding();
    cargarTodo();
  </script>
  <script src="/inactividad.js"></script>
</body>
</html>
