<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secupyme — Registro</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (function() {
      const modo = localStorage.getItem('modo');
      if (modo === 'light') document.body.classList.add('light');
      else if (modo === 'dark') document.body.classList.add('dark');
    })();
  </script>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-logo">
        <h1>SECUPYME</h1>
        <p>CREAR CUENTA</p>
      </div>
      <div class="form-group">
        <label>NOMBRE COMPLETO</label>
        <input type="text" id="nombre" placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label>CORREO ELECTRÓNICO</label>
        <input type="email" id="email" placeholder="correo@empresa.com">
      </div>
      <div class="form-group">
        <label>CONTRASEÑA</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>EMPRESA</label>
        <input type="text" id="empresa" placeholder="Nombre de tu empresa">
      </div>
      <button class="btn-primary" onclick="registrar()">CREAR CUENTA</button>
      <p style="text-align:center; margin-top: 16px; font-size: 12px; color: var(--texto-suave);">¿Ya tienes cuenta? <a href="/" style="color: var(--acento); text-decoration: none;">Inicia sesión</a></p>
      <p class="error-msg" id="error">Error al registrarse</p>
    </div>
  </div>

  <!-- Modal 2FA -->
  <div id="modal2fa" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; display:none; align-items:center; justify-content:center;">
    <div style="background:#0d0618; border:1px solid #7c3aed; border-radius:8px; padding:40px; max-width:420px; width:90%; text-align:center;">
      <h2 style="color:#e2d9f3; font-family:'Share Tech Mono',monospace; letter-spacing:3px; margin-bottom:8px;">ACTIVAR 2FA</h2>
      <p style="color:#6b5a8a; font-size:12px; margin-bottom:24px;">Escanea el código QR con Google Authenticator o una app similar para proteger tu cuenta.</p>
      <img id="qrImg" src="" style="width:180px; height:180px; border:2px solid #7c3aed; border-radius:4px; margin-bottom:24px;">
      <div class="form-group" style="text-align:left;">
        <label>CÓDIGO DE VERIFICACIÓN</label>
        <input type="text" id="codigo2fa" placeholder="000000" maxlength="6" style="letter-spacing:8px; text-align:center;">
      </div>
      <button class="btn-primary" onclick="activar2FA()" style="margin-bottom:12px;">ACTIVAR Y CONTINUAR</button>
      <br>
      <button onclick="omitir2FA()" style="background:none; border:none; color:#6b5a8a; font-family:'Share Tech Mono',monospace; font-size:11px; cursor:pointer; letter-spacing:2px;">OMITIR POR AHORA →</button>
    </div>
  </div>

  <script>
    let tokenTemporal = null;

    async function registrar() {
      const nombre = document.getElementById('nombre').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const empresa = document.getElementById('empresa').value;

      if (!nombre || !email || !password || !empresa) {
        mostrarError('Todos los campos son obligatorios');
        return;
      }

      const response = await fetch('/api/auth/registro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, email, contraseña: password, empresa, rol: 'cliente' })
      });

      const data = await response.json();

      if (response.ok) {
        tokenTemporal = data.token;
        localStorage.setItem('token', tokenTemporal);
        localStorage.setItem('nombre', document.getElementById('nombre').value);
        localStorage.setItem('empresa', document.getElementById('empresa').value);
        await mostrarModal2FA();
      } else {
        mostrarError(data.mensaje || 'Error al registrarse');
      }
    }

    async function mostrarModal2FA() {
      const res = await fetch('/api/auth/2fa/setup', {
        method: 'POST',
        headers: { 'authorization': tokenTemporal }
      });
      if (!res.ok) { omitir2FA(); return; }
      const data = await res.json();
      document.getElementById('qrImg').src = data.qrCode;
      document.getElementById('modal2fa').style.display = 'flex';
    }

    async function activar2FA() {
      const codigo = document.getElementById('codigo2fa').value.trim();
      if (codigo.length !== 6) { mostrarError('Ingresa el código de 6 dígitos'); return; }

      const res = await fetch('/api/auth/2fa/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'authorization': tokenTemporal },
        body: JSON.stringify({ token: codigo })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('onboardingVisto', '1');
        window.location.href = '/dashboard.html';
      } else {
        mostrarError(data.mensaje || 'Código incorrecto');
      }
    }

    function omitir2FA() {
      window.location.href = '/dashboard.html';
    }

    function mostrarError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
