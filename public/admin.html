<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secupyme — Panel Admin</title>
  <link rel="stylesheet" href="styles.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <div class="page-header">
        <h2>PANEL DE ADMINISTRACIÓN</h2>
        <p>Gestión de empresas y membresías</p>
      </div>

      <div class="form-card">
        <h3>EMPRESAS REGISTRADAS</h3>
        <table class="tabla-reportes">
          <thead>
            <tr>
              <th>EMPRESA</th>
              <th>EMAIL</th>
              <th>ROL</th>
              <th>PLAN</th>
              <th>REGISTRO</th>
              <th>ACCIONES</th>
            </tr>
          </thead>
          <tbody id="tablaUsuarios">
          <tr class="skeleton-tabla"><td colspan="6"><div class="skeleton skeleton-row"></div></td></tr>
          <tr class="skeleton-tabla"><td colspan="6"><div class="skeleton skeleton-row"></div></td></tr>
          <tr class="skeleton-tabla"><td colspan="6"><div class="skeleton skeleton-row"></div></td></tr>
        </tbody>
        </table>
      </div>
    

      <!-- ═══ PANEL PREGUNTAS AUTOEVALUACIÓN ═══ -->
      <div class="form-card" style="margin-top:32px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
          <h3>PREGUNTAS DE AUTOEVALUACIÓN</h3>
          <button onclick="document.getElementById('formNuevaPregunta').style.display = document.getElementById('formNuevaPregunta').style.display === 'none' ? 'block' : 'none'"
            style="background:#7c3aed;border:none;color:#fff;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;padding:8px 16px;cursor:pointer;border-radius:4px;">
            + NUEVA PREGUNTA
          </button>
        </div>

        <!-- Formulario nueva pregunta -->
        <div id="formNuevaPregunta" style="display:none;background:#1a0a2e;border:1px solid #7c3aed33;border-radius:6px;padding:20px;margin-bottom:20px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
            <div style="grid-column:1/-1;">
              <label style="font-size:10px;color:#94a3b8;letter-spacing:1px;">TEXTO DE LA PREGUNTA</label>
              <input id="npTexto" type="text" placeholder="¿Su empresa...?" style="width:100%;background:#0d0618;border:1px solid #7c3aed44;color:#e2d9f3;font-family:'Share Tech Mono',monospace;font-size:12px;padding:8px;border-radius:4px;margin-top:4px;" />
            </div>
            <div>
              <label style="font-size:10px;color:#94a3b8;letter-spacing:1px;">CAMPO (clave única)</label>
              <input id="npCampo" type="text" placeholder="miCampoNuevo" style="width:100%;background:#0d0618;border:1px solid #7c3aed44;color:#e2d9f3;font-family:'Share Tech Mono',monospace;font-size:12px;padding:8px;border-radius:4px;margin-top:4px;" />
            </div>
            <div>
              <label style="font-size:10px;color:#94a3b8;letter-spacing:1px;">CATEGORÍA</label>
              <select id="npCategoria" style="width:100%;background:#0d0618;border:1px solid #7c3aed44;color:#e2d9f3;font-family:'Share Tech Mono',monospace;font-size:12px;padding:8px;border-radius:4px;margin-top:4px;">
                <option value="general">General</option>
                <option value="acceso">Acceso</option>
                <option value="datos">Datos</option>
                <option value="red">Red</option>
                <option value="sistemas">Sistemas</option>
                <option value="personas">Personas</option>
                <option value="normativa">Normativa</option>
              </select>
            </div>
            <div>
              <label style="font-size:10px;color:#94a3b8;letter-spacing:1px;">PESO (puntos)</label>
              <input id="npPeso" type="number" min="1" max="10" value="2" style="width:100%;background:#0d0618;border:1px solid #7c3aed44;color:#e2d9f3;font-family:'Share Tech Mono',monospace;font-size:12px;padding:8px;border-radius:4px;margin-top:4px;" />
            </div>
            <div style="grid-column:1/-1;">
              <label style="font-size:10px;color:#94a3b8;letter-spacing:1px;">RECOMENDACIÓN SI RESPONDE NO</label>
              <input id="npRecomendacion" type="text" placeholder="Implementar..." style="width:100%;background:#0d0618;border:1px solid #7c3aed44;color:#e2d9f3;font-family:'Share Tech Mono',monospace;font-size:12px;padding:8px;border-radius:4px;margin-top:4px;" />
            </div>
          </div>
          <button onclick="crearPregunta()" style="background:#7c3aed;border:none;color:#fff;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;padding:10px 20px;cursor:pointer;border-radius:4px;">
            GUARDAR PREGUNTA
          </button>
        </div>

        <table class="tabla-reportes">
          <thead>
            <tr>
              <th>#</th>
              <th>PREGUNTA</th>
              <th>CATEGORÍA</th>
              <th>PESO</th>
              <th>ESTADO</th>
              <th>ACCIÓN</th>
            </tr>
          </thead>
          <tbody id="tablaPreguntas">
            <tr><td colspan="6" style="text-align:center;color:#6b5a8a;padding:24px;">Cargando...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- ═══ PANEL AUDITORÍA ═══ -->
      <div class="form-card" style="margin-top:32px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
          <h3>LOGS DE AUDITORÍA</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <select id="filtroAccion" onchange="cargarAudit()" style="background:#1a0a2e;border:1px solid #7c3aed44;color:#e2d9f3;font-family:'Share Tech Mono',monospace;font-size:11px;padding:6px 10px;border-radius:4px;">
              <option value="">TODAS LAS ACCIONES</option>
              <option value="cambio_plan">CAMBIO PLAN</option>
              <option value="cambio_rol">CAMBIO ROL</option>
              <option value="eliminar_usuario">ELIMINAR USUARIO</option>
              <option value="bloqueo_manual">BLOQUEO MANUAL</option>
              <option value="desbloqueo_manual">DESBLOQUEO MANUAL</option>
            </select>
          </div>
        </div>
        <table class="tabla-reportes">
          <thead>
            <tr>
              <th>FECHA</th>
              <th>ADMIN</th>
              <th>ACCIÓN</th>
              <th>OBJETIVO</th>
              <th>DETALLE</th>
            </tr>
          </thead>
          <tbody id="tablaAudit">
            <tr><td colspan="5" style="text-align:center;color:#6b5a8a;padding:24px;">Cargando logs...</td></tr>
          </tbody>
        </table>
        <div id="auditPaginacion" style="display:flex;gap:8px;justify-content:center;margin-top:16px;"></div>
      </div>

    </main>
  </div>

  <script src="/utils.js"></script>
  <script src="/toast.js"></script>
  <script src="/chat.js"></script>
  <script src="/notifications.js"></script>
  <script src="sidebar.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const rol = localStorage.getItem('rol');
    if (!token) window.location.href = '/';
    if (rol !== 'admin') window.location.href = '/dashboard.html';
    cargarSidebar('admin');
    if (!sessionStorage.getItem('notif_login_done')) {
      const nombre = localStorage.getItem('nombre') || 'Admin';
      Notificaciones.agregar('sistema', 'Sesión iniciada', 'Bienvenido, ' + nombre);
      sessionStorage.setItem('notif_login_done', '1');
    }

    async function cargarUsuarios() {
      const response = await apiFetch('/api/auth/usuarios', {
        headers: { 'authorization': token }
      });
      const usuarios = await response.json();
      const tbody = document.getElementById('tablaUsuarios');
      tbody.innerHTML = '';
      document.querySelectorAll('.skeleton-tabla').forEach(r => r.remove());

      usuarios.forEach(u => {
        const fecha = formatFecha(u.fechaRegistro);
        tbody.innerHTML += `
          <tr>
            <td data-label="EMPRESA">${u.empresa}</td>
            <td data-label="EMAIL" style="font-size: 11px; color: var(--texto-suave);">${u.email}</td>
            <td data-label="ROL"><span class="badge ${u.rol === 'admin' ? 'badge-resuelto' : 'badge-proceso'}">${u.rol.toUpperCase()}</span></td>
            <td data-label="PLAN"><span class="badge badge-proceso">${(u.plan || 'free').toUpperCase()}</span></td>
            <td data-label="REGISTRO" style="font-size: 11px; color: var(--texto-suave);">${fecha}</td>
            <td data-label="ACCIONES">
              <select onchange="cambiarPlan('${u._id}', this.value)" style="font-size: 10px; padding: 4px 8px; margin-right: 4px;">
                <option value="free" ${u.plan === 'free' ? 'selected' : ''}>FREE</option>
                <option value="basico" ${u.plan === 'basico' ? 'selected' : ''}>BÁSICO</option>
                <option value="premium" ${u.plan === 'premium' ? 'selected' : ''}>PREMIUM</option>
              </select>
              <select onchange="cambiarRol('${u._id}', this.value)" style="font-size: 10px; padding: 4px 8px;">
                <option value="cliente" ${u.rol === 'cliente' ? 'selected' : ''}>CLIENTE</option>
                <option value="admin" ${u.rol === 'admin' ? 'selected' : ''}>ADMIN</option>
              </select>
              <button onclick="eliminarUsuario('${u._id}', '${u.rol}', '${u.nombre}')" style="font-size: 10px; padding: 4px 8px; margin-left: 4px; background:#ef4444; border:none; color:white; font-family:'Share Tech Mono',monospace; cursor:pointer; border-radius:2px;">DEL</button>
            </td>
          </tr>
        `;
      });
    }

    async function cambiarPlan(userId, plan) {
      await apiFetch(`/api/auth/usuarios/${userId}/plan`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'authorization': token },
        body: JSON.stringify({ plan })
      });
      cargarUsuarios();
    cargarAudit();
    cargarPreguntas();
    }

    async function cambiarRol(userId, rol) {
      await apiFetch(`/api/auth/usuarios/${userId}/rol`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'authorization': token },
        body: JSON.stringify({ rol })
      });
      cargarUsuarios();
    cargarAudit();
    cargarPreguntas();
    }

    async function eliminarUsuario(userId, rol, nombre) {
      const esAdmin = rol === 'admin';
      const mensaje = esAdmin
        ? 'ATENCIÓN: ' + nombre + ' es administrador.\n\n¿Estás seguro de que deseas eliminar esta cuenta? Esta acción no se puede deshacer.'
        : '¿Estás seguro de que deseas eliminar a ' + nombre + '?\n\nEsta acción no se puede deshacer.';
      if (!confirm(mensaje)) return;
      const res = await apiFetch(`/api/auth/usuarios/${userId}`, {
        method: 'DELETE',
        headers: { 'authorization': token }
      });
      if (res.ok) {
        cargarUsuarios();
    cargarAudit();
    cargarPreguntas();
      } else {
        const data = await res.json();
        alert(data.mensaje || 'Error al eliminar usuario');
      }
    }

    cargarUsuarios();
    cargarAudit();
    cargarPreguntas();
  </script>
  
  <script src="/inactividad.js">
    const AUDIT_BADGE = {
      cambio_plan:      { color: '#a855f7', bg: '#7c3aed22', label: 'PLAN' },
      cambio_rol:       { color: '#f59e0b', bg: '#f59e0b22', label: 'ROL' },
      eliminar_usuario: { color: '#ef4444', bg: '#ef444422', label: 'ELIMINAR' },
      bloqueo_manual:   { color: '#ef4444', bg: '#ef444422', label: 'BLOQUEO' },
      desbloqueo_manual:{ color: '#4ade80', bg: '#4ade8022', label: 'DESBLOQUEO' }
    };

    let auditPaginaActual = 1;

    async function cargarAudit(page = 1) {
      auditPaginaActual = page;
      const accion = document.getElementById('filtroAccion').value;
      const params = new URLSearchParams({ limit: 10, page });
      if (accion) params.append('accion', accion);

      try {
        const res = await apiFetch(`/api/audit?${params}`, { headers: { 'authorization': token } });
        const data = await res.json();
        const tbody = document.getElementById('tablaAudit');
        tbody.innerHTML = '';

        if (!data.logs || data.logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#6b5a8a;padding:24px;">Sin registros</td></tr>';
          document.getElementById('auditPaginacion').innerHTML = '';
          return;
        }

        data.logs.forEach(log => {
          const badge = AUDIT_BADGE[log.accion] || { color: '#94a3b8', bg: '#94a3b822', label: log.accion };
          const fecha = formatFechaHora(log.timestamp);
          tbody.innerHTML += `
            <tr>
              <td style="font-size:11px;color:#6b5a8a;">${fecha}</td>
              <td style="font-size:12px;">${log.adminNombre || '—'}</td>
              <td><span style="background:${badge.bg};color:${badge.color};border:1px solid ${badge.color}44;padding:3px 8px;border-radius:3px;font-size:10px;letter-spacing:1px;">${badge.label}</span></td>
              <td style="font-size:12px;">${log.targetNombre || '—'}</td>
              <td style="font-size:11px;color:#94a3b8;">${log.detalle || '—'}</td>
            </tr>
          `;
        });

        // Paginación
        const pag = document.getElementById('auditPaginacion');
        pag.innerHTML = '';
        for (let i = 1; i <= data.pages; i++) {
          pag.innerHTML += `<button onclick="cargarAudit(${i})" style="background:${i === page ? '#7c3aed' : '#1a0a2e'};border:1px solid #7c3aed44;color:#e2d9f3;font-family:'Share Tech Mono',monospace;font-size:10px;padding:6px 12px;cursor:pointer;border-radius:3px;">${i}</button>`;
        }
      } catch (e) {
        console.error('Error cargando audit:', e);
      }
    }

  
    async function cargarPreguntas() {
      try {
        const res = await apiFetch('/api/autoevaluaciones/preguntas/todas', { headers: { 'authorization': token } });
        const preguntas = await res.json();
        const tbody = document.getElementById('tablaPreguntas');
        tbody.innerHTML = '';
        preguntas.forEach((p, i) => {
          tbody.innerHTML += `
            <tr>
              <td style="color:#6b5a8a;font-size:11px;">${i + 1}</td>
              <td style="font-size:12px;max-width:300px;">${p.texto}</td>
              <td><span style="background:#7c3aed22;color:#a855f7;border:1px solid #7c3aed44;padding:2px 8px;border-radius:3px;font-size:10px;">${p.categoria}</span></td>
              <td style="text-align:center;color:#7c3aed;font-weight:bold;">${p.peso}</td>
              <td><span style="color:${p.activa ? '#4ade80' : '#ef4444'};font-size:11px;">${p.activa ? '● ACTIVA' : '○ INACTIVA'}</span></td>
              <td>
                <button onclick="togglePregunta('${p._id}', ${p.activa})"
                  style="background:${p.activa ? '#ef444422' : '#4ade8022'};border:1px solid ${p.activa ? '#ef4444' : '#4ade80'};color:${p.activa ? '#ef4444' : '#4ade80'};font-family:'Share Tech Mono',monospace;font-size:9px;padding:4px 10px;cursor:pointer;border-radius:3px;">
                  ${p.activa ? 'DESACTIVAR' : 'ACTIVAR'}
                </button>
              </td>
            </tr>
          `;
        });
      } catch (e) { console.error('Error cargando preguntas:', e); }
    }

    async function togglePregunta(id, activa) {
      const accion = activa ? 'desactivar' : 'activar';
      if (!confirm(`¿Seguro que deseas ${accion} esta pregunta?`)) return;
      try {
        const res = await apiFetch(`/api/autoevaluaciones/preguntas/${id}/toggle`, {
          method: 'PUT',
          headers: { 'authorization': token }
        });
        if (res.ok) { cargarPreguntas(); }
        else { alert('Error al cambiar estado'); }
      } catch (e) { alert('Error de conexión'); }
    }

    async function crearPregunta() {
      const texto        = document.getElementById('npTexto').value.trim();
      const campo        = document.getElementById('npCampo').value.trim();
      const categoria    = document.getElementById('npCategoria').value;
      const peso         = Number(document.getElementById('npPeso').value);
      const recomendacion= document.getElementById('npRecomendacion').value.trim();

      if (!texto || !campo || !peso) {
        alert('Texto, campo y peso son requeridos');
        return;
      }

      try {
        const res = await apiFetch('/api/autoevaluaciones/preguntas', {
          method: 'POST',
          headers: { 'authorization': token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ texto, campo, categoria, peso, recomendacion })
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('formNuevaPregunta').style.display = 'none';
          ['npTexto','npCampo','npRecomendacion'].forEach(id => document.getElementById(id).value = '');
          cargarPreguntas();
        } else {
          alert(data.mensaje || 'Error al crear pregunta');
        }
      } catch (e) { alert('Error de conexión'); }
    }

  </script>
</body>
</html>
