<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secupyme — Panel Admin</title>
  <link rel="stylesheet" href="styles.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <div class="page-header">
        <h2>PANEL DE ADMINISTRACIÓN</h2>
        <p>Gestión de empresas y membresías</p>
      </div>

      <div class="form-card">
        <h3>EMPRESAS REGISTRADAS</h3>
        <table class="tabla-reportes">
          <thead>
            <tr>
              <th>EMPRESA</th>
              <th>EMAIL</th>
              <th>ROL</th>
              <th>PLAN</th>
              <th>REGISTRO</th>
              <th>ACCIONES</th>
            </tr>
          </thead>
          <tbody id="tablaUsuarios">
          <tr class="skeleton-tabla"><td colspan="6"><div class="skeleton skeleton-row"></div></td></tr>
          <tr class="skeleton-tabla"><td colspan="6"><div class="skeleton skeleton-row"></div></td></tr>
          <tr class="skeleton-tabla"><td colspan="6"><div class="skeleton skeleton-row"></div></td></tr>
        </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/toast.js"></script>
  <script src="/chat.js"></script>
  <script src="/notifications.js"></script>
  <script src="sidebar.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const rol = localStorage.getItem('rol');
    if (!token) window.location.href = '/';
    if (rol !== 'admin') window.location.href = '/dashboard.html';
    cargarSidebar('admin');
    if (!sessionStorage.getItem('notif_login_done')) {
      const nombre = localStorage.getItem('nombre') || 'Admin';
      Notificaciones.agregar('sistema', 'Sesión iniciada', 'Bienvenido, ' + nombre);
      sessionStorage.setItem('notif_login_done', '1');
    }

    async function cargarUsuarios() {
      const response = await fetch('/api/auth/usuarios', {
        headers: { 'authorization': token }
      });
      const usuarios = await response.json();
      const tbody = document.getElementById('tablaUsuarios');
      tbody.innerHTML = '';
      document.querySelectorAll('.skeleton-tabla').forEach(r => r.remove());

      usuarios.forEach(u => {
        const fecha = new Date(u.fechaRegistro).toLocaleDateString('es-CO');
        tbody.innerHTML += `
          <tr>
            <td data-label="EMPRESA">${u.empresa}</td>
            <td data-label="EMAIL" style="font-size: 11px; color: var(--texto-suave);">${u.email}</td>
            <td data-label="ROL"><span class="badge ${u.rol === 'admin' ? 'badge-resuelto' : 'badge-proceso'}">${u.rol.toUpperCase()}</span></td>
            <td data-label="PLAN"><span class="badge badge-proceso">${(u.plan || 'free').toUpperCase()}</span></td>
            <td data-label="REGISTRO" style="font-size: 11px; color: var(--texto-suave);">${fecha}</td>
            <td data-label="ACCIONES">
              <select onchange="cambiarPlan('${u._id}', this.value)" style="font-size: 10px; padding: 4px 8px; margin-right: 4px;">
                <option value="free" ${u.plan === 'free' ? 'selected' : ''}>FREE</option>
                <option value="basico" ${u.plan === 'basico' ? 'selected' : ''}>BÁSICO</option>
                <option value="premium" ${u.plan === 'premium' ? 'selected' : ''}>PREMIUM</option>
              </select>
              <select onchange="cambiarRol('${u._id}', this.value)" style="font-size: 10px; padding: 4px 8px;">
                <option value="cliente" ${u.rol === 'cliente' ? 'selected' : ''}>CLIENTE</option>
                <option value="admin" ${u.rol === 'admin' ? 'selected' : ''}>ADMIN</option>
              </select>
              <button onclick="eliminarUsuario('${u._id}', '${u.rol}', '${u.nombre}')" style="font-size: 10px; padding: 4px 8px; margin-left: 4px; background:#ef4444; border:none; color:white; font-family:'Share Tech Mono',monospace; cursor:pointer; border-radius:2px;">✕</button>
            </td>
          </tr>
        `;
      });
    }

    async function cambiarPlan(userId, plan) {
      await fetch(`/api/auth/usuarios/${userId}/plan`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'authorization': token },
        body: JSON.stringify({ plan })
      });
      cargarUsuarios();
    }

    async function cambiarRol(userId, rol) {
      await fetch(`/api/auth/usuarios/${userId}/rol`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'authorization': token },
        body: JSON.stringify({ rol })
      });
      cargarUsuarios();
    }

    async function eliminarUsuario(userId, rol, nombre) {
      const esAdmin = rol === 'admin';
      const mensaje = esAdmin
        ? '⚠️ ATENCIÓN: ' + nombre + ' es administrador.\n\n¿Estás seguro de que deseas eliminar esta cuenta? Esta acción no se puede deshacer.'
        : '¿Estás seguro de que deseas eliminar a ' + nombre + '?\n\nEsta acción no se puede deshacer.';
      if (!confirm(mensaje)) return;
      const res = await fetch(`/api/auth/usuarios/${userId}`, {
        method: 'DELETE',
        headers: { 'authorization': token }
      });
      if (res.ok) {
        cargarUsuarios();
      } else {
        const data = await res.json();
        alert(data.mensaje || 'Error al eliminar usuario');
      }
    }

    cargarUsuarios();
  </script>
  
  <script src="/inactividad.js"></script>
</body>
</html>
