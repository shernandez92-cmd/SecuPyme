<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secupyme — Historial</title>
  <link rel="stylesheet" href="styles.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <div class="page-header">
        <h2>HISTORIAL DE SEGURIDAD</h2>
        <p>Evolución del nivel de seguridad de tu empresa</p>
      </div>

      <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="stat-card">
          <div class="stat-icon">📋</div>
          <div class="stat-info">
            <h3 id="totalEvaluaciones">0</h3>
            <p>EVALUACIONES TOTALES</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📈</div>
          <div class="stat-info">
            <h3 id="mejorPuntaje">0</h3>
            <p>MEJOR PUNTAJE</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🎯</div>
          <div class="stat-info">
            <h3 id="ultimoNivel">—</h3>
            <p>ÚLTIMO NIVEL</p>
          </div>
        </div>
      </div>

      <div class="form-card" style="margin-top: 24px;">
        <h3>EVALUACIONES ANTERIORES <a href="#" onclick="descargarPDF()" style="float: right; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--acento); letter-spacing: 2px; text-decoration: none;">↓ EXPORTAR PDF</a> <a href="#" onclick="verResumenSemanal()" style="float: right; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #10b981; letter-spacing: 2px; text-decoration: none; margin-right: 16px;">🤖 RESUMEN IA</a></h3>
        <table class="tabla-reportes">
          <thead>
            <tr>
              <th>FECHA</th>
              <th>PUNTAJE</th>
              <th>NIVEL DE RIESGO</th>
              <th>RECOMENDACIONES</th>
            </tr>
          </thead>
          <tbody id="tablaHistorial">
          <tr class="skeleton-tabla"><td colspan="4"><div class="skeleton skeleton-row"></div></td></tr>
          <tr class="skeleton-tabla"><td colspan="4"><div class="skeleton skeleton-row"></div></td></tr>
          <tr class="skeleton-tabla"><td colspan="4"><div class="skeleton skeleton-row"></div></td></tr>
        </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/utils.js"></script>
  <script src="/toast.js"></script>
  <script src="/chat.js"></script>
  <script src="sidebar.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/';
    cargarSidebar('historial');

    async function cargarHistorial() {
      const response = await apiFetch('/api/autoevaluaciones?limit=100', {
        headers: { 'authorization': token }
      });
      const data = await response.json();
      const evaluaciones = data.autoevaluaciones || data;

      document.getElementById('totalEvaluaciones').textContent = data.total ?? evaluaciones.length;

      if (evaluaciones.length > 0) {
        const mejorPuntaje = Math.max(...evaluaciones.map(e => e.puntaje));
        document.getElementById('mejorPuntaje').textContent = `${mejorPuntaje}/20`;
        const ultima = evaluaciones[evaluaciones.length - 1];
        const nivelEl = document.getElementById('ultimoNivel');
        nivelEl.textContent = ultima.nivelRiesgo.toUpperCase();
        nivelEl.style.color = ultima.nivelRiesgo === 'alto' ? '#ef4444' : ultima.nivelRiesgo === 'medio' ? '#f59e0b' : '#10b981';
      }

      const tbody = document.getElementById('tablaHistorial');
      tbody.innerHTML = '';
      document.querySelectorAll('.skeleton-tabla').forEach(r => r.remove());
if (evaluaciones.length === 0) {
  tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 48px; color: var(--texto-suave); font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 2px;"><div style="font-size: 32px; margin-bottom: 12px;">📋</div>SIN EVALUACIONES AÚN</td></tr>`;
  return;
}
evaluaciones.reverse().forEach(e => {
        const fecha = formatFecha(e.fecha);
        const badgeClass = e.nivelRiesgo === 'alto' ? 'badge-abierto' : e.nivelRiesgo === 'medio' ? 'badge-proceso' : 'badge-resuelto';
        tbody.innerHTML += `
          <tr>
            <td data-label="FECHA">${fecha}</td>
            <td data-label="PUNTAJE" style="font-family: 'Share Tech Mono', monospace; color: var(--acento);">${e.puntaje}/20</td>
            <td data-label="NIVEL"><span class="badge ${badgeClass}">${e.nivelRiesgo.toUpperCase()}</span></td>
            <td data-label="RECOMENDACIONES" style="color: var(--texto-suave); font-size: 12px;">${e.recomendaciones.length} recomendaciones</td>
          </tr>
        `;
      });
    }

    function descargarPDF() {
      window.open(`/api/pdf/autoevaluaciones?token=${token}`);
    }

    cargarHistorial();

    async function verResumenSemanal() {
      const token = localStorage.getItem("token");
      mostrarToast("Generando resumen...", "info", 3000);
      try {
        const r = await apiFetch("/api/ia/resumen-semanal", { headers: { "authorization": token } });
        const d = await r.json();
        const m = document.createElement("div");
        m.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;";
        m.innerHTML = "<div style=background:var(--morado-oscuro);border:1px solid #10b981;border-radius:4px;padding:32px;max-width:640px;width:100%;position:relative;max-height:80vh;overflow-y:auto;><button onclick=this.parentElement.parentElement.remove() style=position:absolute;top:16px;right:16px;background:none;border:none;color:var(--texto-suave);cursor:pointer;font-size:18px;>X</button><p style=font-family:Share Tech Mono,monospace;font-size:11px;color:#10b981;letter-spacing:3px;margin-bottom:16px;>RESUMEN SEMANAL IA</p><p style=font-size:13px;line-height:1.8;color:var(--texto);white-space:pre-wrap;>" + d.resumen + "</p></div>";
        document.body.appendChild(m);
        m.onclick = (e) => { if (e.target === m) m.remove(); };
      } catch(e) { mostrarToast("Error generando resumen", "error"); }
    }
  </script>
</body>
</html>
