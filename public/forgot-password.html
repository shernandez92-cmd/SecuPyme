<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — SecuPyme</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0618;
      color: #e2e8f0;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a0a2e;
      border: 1px solid #7c3aed44;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    h1 { color: #7c3aed; font-size: 1.4rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 24px; line-height: 1.6; }
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #0d0618;
      border: 1px solid #7c3aed66;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      padding: 10px 14px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #7c3aed; }
    button {
      width: 100%;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      padding: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #6d28d9; }
    button:disabled { background: #4a1d96; cursor: not-allowed; }
    .mensaje {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
    .mensaje.ok { background: #14532d44; border: 1px solid #16a34a; color: #4ade80; }
    .mensaje.error { background: #7f1d1d44; border: 1px solid #dc2626; color: #f87171; }
    .volver { display: block; text-align: center; margin-top: 20px; font-size: 0.8rem; color: #6b5a8a; text-decoration: none; }
    .volver:hover { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 Recuperar contraseña</h1>
    <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="correo@empresa.com" />
    <button id="btn" onclick="enviar()">ENVIAR ENLACE</button>
    <div class="mensaje" id="msg"></div>
    <a href="/" class="volver">← Volver al login</a>
  </div>

  <script>
    async function enviar() {
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('btn');

      if (!email) {
        mostrar('Ingresa tu correo electrónico.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        mostrar(data.mensaje || 'Si ese email está registrado, recibirás un enlace.', 'ok');
        btn.textContent = 'Enviado';
      } catch (e) {
        mostrar('Error de conexión. Intenta de nuevo.', 'error');
        btn.disabled = false;
        btn.textContent = 'ENVIAR ENLACE';
      }
    }

    function mostrar(texto, tipo) {
      const msg = document.getElementById('msg');
      msg.textContent = texto;
      msg.className = 'mensaje ' + tipo;
      msg.style.display = 'block';
    }

    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') enviar();
    });
  </script>
</body>
</html>
