<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secupyme — Detalle de Reporte</title>
  <link rel="stylesheet" href="styles.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <div class="page-header">
        <a href="/reportes.html" style="color: var(--texto-suave); font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px; text-decoration: none;">← VOLVER</a>
        <h2 style="margin-top: 12px;">DETALLE DE REPORTE</h2>
        <p id="fechaReporte"></p>
      </div>

      <div id="skeleton-detalle" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
        <div class="skeleton-card">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-line" style="width:60%"></div>
          <div class="skeleton skeleton-line" style="width:80%"></div>
          <div class="skeleton skeleton-line" style="width:50%"></div>
          <div class="skeleton skeleton-line" style="width:70%"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-line" style="width:90%"></div>
          <div class="skeleton skeleton-line" style="width:60%"></div>
          <div class="skeleton skeleton-line" style="width:75%"></div>
        </div>
      </div>

      <div id="contenido-detalle" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; display:none;">
        <div class="form-card">
          <h3>INFORMACIÓN DEL REPORTE</h3>
          <div style="margin-bottom: 20px;">
            <p style="font-size: 11px; letter-spacing: 2px; color: var(--texto-suave); margin-bottom: 6px;">EMPRESA</p>
            <p id="empresa" style="font-family: 'Share Tech Mono', monospace; color: var(--acento);"></p>
          </div>
          <div style="margin-bottom: 20px;">
            <p style="font-size: 11px; letter-spacing: 2px; color: var(--texto-suave); margin-bottom: 6px;">REPORTADO POR</p>
            <p id="reportadoPor" style="font-family: 'Share Tech Mono', monospace; color: var(--texto);"></p>
          </div>
          <div style="margin-bottom: 20px;">
            <p style="font-size: 11px; letter-spacing: 2px; color: var(--texto-suave); margin-bottom: 6px;">EMAIL</p>
            <p id="emailUsuario" style="font-family: 'Share Tech Mono', monospace; color: var(--texto);"></p>
          </div>
          <div style="margin-bottom: 20px;">
            <p style="font-size: 11px; letter-spacing: 2px; color: var(--texto-suave); margin-bottom: 6px;">TIPO DE VULNERABILIDAD</p>
            <p id="tipoVulnerabilidad" style="font-family: 'Share Tech Mono', monospace; color: var(--acento);"></p>
          </div>
          <div>
            <p style="font-size: 11px; letter-spacing: 2px; color: var(--texto-suave); margin-bottom: 6px;">DESCRIPCIÓN COMPLETA</p>
            <p id="descripcion" style="font-size: 14px; color: var(--texto); line-height: 1.6;"></p>
          </div>
        </div>
<div style="margin-top: 20px;" id="shodanSeccion">
  <p style="font-size: 11px; letter-spacing: 2px; color: var(--texto-suave); margin-bottom: 8px;">CONSULTA SHODAN</p>
  <div style="display: flex; gap: 8px;">
    <input type="text" id="ipShodan" placeholder="IP a consultar..." style="flex: 1;">
    <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="consultarShodan()">CONSULTAR</button>
  </div>
  <div id="resultadoShodan" style="margin-top: 12px; display: none; padding: 16px; background: rgba(5,5,8,0.9); border: 1px solid var(--borde); border-radius: 2px;">
    <div id="shodanData" style="font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--texto-suave); line-height: 2;"></div>
  </div>
</div>o
<div style="margin-top: 20px;">
  <p style="font-size: 11px; letter-spacing: 2px; color: var(--texto-suave); margin-bottom: 8px;">CONSULTA VIRUSTOTAL</p>
  <div style="display: flex; gap: 8px;">
    <input type="text" id="hashVT" placeholder="Hash MD5/SHA256 del archivo..." style="flex: 1;">
    <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="consultarVirusTotal()">CONSULTAR</button>
  </div>
  <div id="resultadoVT" style="margin-top: 12px; display: none; padding: 16px; background: rgba(5,5,8,0.9); border: 1px solid var(--borde); border-radius: 2px;">
    <div id="vtData" style="font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--texto-suave); line-height: 2;"></div>
  </div>
</div>
        <div id="panelAdmin">
          <div class="form-card" style="margin-bottom: 24px;">
            <h3>ESTADO Y PRIORIDAD</h3>
            <div class="form-group">
              <label>ESTADO</label>
              <select id="estado">
                <option value="abierto">ABIERTO</option>
                <option value="en proceso">EN PROCESO</option>
                <option value="resuelto">RESUELTO</option>
              </select>
            </div>
            <div class="form-group" style="margin-top: 16px;">
              <label>PRIORIDAD</label>
              <select id="prioridad">
                <option value="alta">ALTA</option>
                <option value="media">MEDIA</option>
                <option value="baja">BAJA</option>
              </select>
            </div>
          </div>
          <div class="form-card">
            <h3>NOTAS Y PASOS A SEGUIR</h3>
            <div class="form-group">
              <label>NOTAS PARA EL CLIENTE</label>
              <textarea id="notasAdmin" placeholder="Escribe los pasos a seguir..." style="min-height: 150px;"></textarea>
            </div>
            <button class="btn-primary" style="width: auto; padding: 12px 32px; margin-top: 16px;" onclick="actualizarReporte()">GUARDAR CAMBIOS</button>
<div style="display: flex; gap: 8px; margin-top: 12px;">
  <button class="btn-secondary" style="padding: 10px 20px;" onclick="archivarReporte()">ARCHIVAR</button>
  <button style="background: transparent; border: 1px solid #ef4444; color: #ef4444; font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px; padding: 10px 20px; cursor: pointer; border-radius: 1px;" onclick="eliminarReporte()">ELIMINAR</button>
</div>
            <p id="mensajeExito" style="display:none; color: #10b981; font-family: 'Share Tech Mono', monospace; font-size: 12px; margin-top: 12px; letter-spacing: 2px;">CAMBIOS GUARDADOS — CLIENTE NOTIFICADO</p>
          </div>
        </div>
      </div>

      <div class="form-card" style="margin-top: 24px;">
        <h3>CHAT</h3>
        <div id="mensajes" style="min-height: 200px; max-height: 300px; overflow-y: auto; margin-bottom: 16px; padding: 16px; background: rgba(5,5,8,0.9); border: 1px solid var(--borde); border-radius: 2px;"></div>
        <div style="display: flex; gap: 12px;">
          <input type="text" id="textoMensaje" placeholder="Escribe un mensaje..." style="flex: 1;">
          <button class="btn-primary" style="width: auto; padding: 12px 24px;" onclick="enviarMensaje()">ENVIAR</button>
        </div>
      </div>

    </main>
  </div>

  <script src="/utils.js"></script>
  <script src="/toast.js"></script>
  <script src="/chat.js"></script>
  <script src="sidebar.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const rol = localStorage.getItem('rol');

    if (!token) window.location.href = '/';

    cargarSidebar('reportes');

    if (rol !== 'admin') {
      document.getElementById('panelAdmin').style.display = 'none';
    }

    const params = new URLSearchParams(window.location.search);
    const reporteId = params.get('id');

    async function cargarReporte() {
      const response = await fetch(`/api/reportes/${reporteId}`, {
        headers: { 'authorization': token }
      });
      const r = await response.json();

      document.getElementById('skeleton-detalle').style.display = 'none';
      document.getElementById('contenido-detalle').style.display = 'grid';
      document.getElementById('empresa').textContent = r.empresa;
      document.getElementById('reportadoPor').textContent = r.usuario.nombre;
      document.getElementById('emailUsuario').textContent = r.usuario.email;
      document.getElementById('tipoVulnerabilidad').textContent = r.tipoVulnerabilidad.toUpperCase();
      document.getElementById('descripcion').textContent = r.descripcion;
      document.getElementById('fechaReporte').textContent = formatFecha(r.fecha);
      document.getElementById('estado').value = r.estado;
      document.getElementById('prioridad').value = r.prioridad;
      document.getElementById('notasAdmin').value = r.notasAdmin;
    }
async function consultarShodan() {
  const ip = document.getElementById('ipShodan').value;
  if (!ip) return;
  const response = await fetch(`/api/integraciones/shodan/${ip}`, {
    headers: { 'authorization': token }
  });
  const data = await response.json();
  if (data.mensaje) {
    document.getElementById('shodanData').innerHTML = `<p style="color: #ef4444;">${data.mensaje}</p>`;
  } else {
    document.getElementById('shodanData').innerHTML = `
      <p>IP: ${data.ip}</p>
      <p>País: ${data.paises || '—'}</p>
      <p>Organización: ${data.organizacion || '—'}</p>
      <p>Sistema: ${data.sistema || '—'}</p>
      <p>Puertos abiertos: ${data.puertos ? data.puertos.join(', ') : '—'}</p>
      <p>Vulnerabilidades: ${data.vulnerabilidades.length > 0 ? data.vulnerabilidades.join(', ') : 'Ninguna detectada'}</p>
    `;
  }
  document.getElementById('resultadoShodan').style.display = 'block';
}
async function consultarVirusTotal() {
  const hash = document.getElementById('hashVT').value;
  if (!hash) return;
  const response = await fetch(`/api/integraciones/virustotal/${hash}`, {
    headers: { 'authorization': token }
  });
  const data = await response.json();
  if (data.mensaje) {
    document.getElementById('vtData').innerHTML = `<p style="color: #ef4444;">${data.mensaje}</p>`;
  } else {
    const nivelColor = data.malicioso > 0 ? '#ef4444' : '#10b981';
    document.getElementById('vtData').innerHTML = `
      <p>Archivo: ${data.nombre}</p>
      <p style="color: ${nivelColor};">Detecciones maliciosas: ${data.malicioso}</p>
      <p style="color: #f59e0b;">Sospechoso: ${data.sospechoso}</p>
      <p style="color: #10b981;">Limpio: ${data.limpio}</p>
      <p>Tipo: ${data.tipo || '—'}</p>
      <p>Tamaño: ${data.tamaño ? (data.tamaño / 1024).toFixed(2) + ' KB' : '—'}</p>
    `;
  }
  document.getElementById('resultadoVT').style.display = 'block';
}
async function eliminarReporte() {
  if (!confirm('¿Eliminar este reporte? Esta acción no se puede deshacer.')) return;
  await fetch(`/api/reportes/${reporteId}`, {
    method: 'DELETE',
    headers: { 'authorization': token }
  });
  window.location.href = '/reportes.html';
}

async function archivarReporte() {
  if (!confirm('¿Archivar este reporte?')) return;
  await fetch(`/api/reportes/${reporteId}/archivar`, {
    method: 'PUT',
    headers: { 'authorization': token }
  });
  window.location.href = '/reportes.html';
}
    async function actualizarReporte() {
      const estado = document.getElementById('estado').value;
      const prioridad = document.getElementById('prioridad').value;
      const notasAdmin = document.getElementById('notasAdmin').value;

      const response = await fetch(`/api/reportes/${reporteId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'authorization': token
        },
        body: JSON.stringify({ estado, prioridad, notasAdmin })
      });

      if (response.ok) {
        document.getElementById('mensajeExito').style.display = 'block';
        setTimeout(() => {
          document.getElementById('mensajeExito').style.display = 'none';
        }, 3000);
      }
    }

    async function cargarMensajes() {
      const response = await fetch(`/api/mensajes/${reporteId}`, {
        headers: { 'authorization': token }
      });
      const mensajes = await response.json();
      const contenedor = document.getElementById('mensajes');
      contenedor.innerHTML = '';

      mensajes.forEach(m => {
        const esYo = m.usuario.rol === rol;
        const fecha = formatHora(m.fecha);
        contenedor.innerHTML += `
          <div style="margin-bottom: 12px; text-align: ${esYo ? 'right' : 'left'};">
            <span style="font-size: 10px; color: var(--texto-suave); letter-spacing: 1px;">${m.usuario.nombre} · ${fecha}</span>
            <div style="display: inline-block; background: ${esYo ? 'rgba(124,58,237,0.2)' : 'rgba(255,255,255,0.05)'}; border: 1px solid ${esYo ? 'var(--morado-claro)' : 'var(--borde)'}; padding: 8px 14px; border-radius: 2px; margin-top: 4px; font-size: 13px; max-width: 80%;">
              ${m.texto}
            </div>
          </div>
        `;
      });
      contenedor.scrollTop = contenedor.scrollHeight;
    }

    async function enviarMensaje() {
      const texto = document.getElementById('textoMensaje').value;
      if (!texto) return;

      await fetch(`/api/mensajes/${reporteId}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'authorization': token
        },
        body: JSON.stringify({ texto })
      });

      document.getElementById('textoMensaje').value = '';
      cargarMensajes();
    }

    cargarReporte();
    cargarMensajes();
    setInterval(cargarMensajes, 5000);
  </script>
</body>
</html>
