<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña — SecuPyme</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0618;
      color: #e2e8f0;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a0a2e;
      border: 1px solid #7c3aed44;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    h1 { color: #7c3aed; font-size: 1.4rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 24px; }
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #0d0618;
      border: 1px solid #7c3aed66;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      padding: 10px 14px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #7c3aed; }
    button {
      width: 100%;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      padding: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #6d28d9; }
    button:disabled { background: #4a1d96; cursor: not-allowed; }
    .mensaje {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
    .mensaje.ok { background: #14532d44; border: 1px solid #16a34a; color: #4ade80; }
    .mensaje.error { background: #7f1d1d44; border: 1px solid #dc2626; color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="display:flex;align-items:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:inline-block;vertical-align:middle"><rect x="4" y="7.5" width="8" height="6" rx="1" stroke="#7c3aed" stroke-width="1.1"/><path d="M5.5 7.5V5a2.5 2.5 0 015 0v2.5" stroke="#7c3aed" stroke-width="1.1" stroke-linecap="round"/><circle cx="8" cy="10.5" r="1" fill="#7c3aed"/></svg> <span>🔐 Nueva contraseña</span></h1>
    <p>Ingresa tu nueva contraseña. Debe tener al menos 8 caracteres.</p>
    <label for="pass">Nueva contraseña</label>
    <input type="password" id="pass" placeholder="••••••••" />
    <label for="pass2">Confirmar contraseña</label>
    <input type="password" id="pass2" placeholder="••••••••" />
    <button id="btn" onclick="resetear()">Restablecer contraseña</button>
    <div class="mensaje" id="msg"></div>
  </div>

  <script>
    async function resetear() {
      const pass = document.getElementById('pass').value;
      const pass2 = document.getElementById('pass2').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn');

      msg.style.display = 'none';

      if (pass.length < 8) {
        mostrar('La contraseña debe tener al menos 8 caracteres.', 'error');
        return;
      }
      if (pass !== pass2) {
        mostrar('Las contraseñas no coinciden.', 'error');
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (!token) {
        mostrar('Token inválido. Solicita un nuevo enlace.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Procesando...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, nuevaContraseña: pass })
        });
        const data = await res.json();
        if (res.ok) {
          mostrar('✓ ' + data.mensaje, 'ok');
          btn.textContent = 'Ir al login';
          btn.disabled = false;
          btn.onclick = () => window.location.href = '/index.html';
        } else {
          mostrar(data.mensaje || 'Error al restablecer.', 'error');
          btn.disabled = false;
          btn.textContent = 'Restablecer contraseña';
        }
      } catch (e) {
        mostrar('Error de conexión.', 'error');
        btn.disabled = false;
        btn.textContent = 'Restablecer contraseña';
      }
    }

    function mostrar(texto, tipo) {
      const msg = document.getElementById('msg');
      msg.textContent = texto;
      msg.className = 'mensaje ' + tipo;
      msg.style.display = 'block';
    }
  </script>
</body>
</html>
